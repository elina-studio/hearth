<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0E09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hearth Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E09;
    --bg2: #12170F;
    --panel: #161C12;
    --line: #2A3322;
    --olive: #7C8A4E;
    --gold: #E0B34A;
    --gold-dim: #8C7232;
    --text: #E9E4CC;
    --muted: #B5AF8C;
    --red: #C9694A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 400 16px/1.4 Barlow, system-ui, sans-serif;
    min-height: 100dvh;
    padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 60% at 50% -10%, #1A2213 0%, transparent 60%),
      var(--bg);
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  .wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .caps { font-family: "Barlow Condensed", Barlow, sans-serif; text-transform: uppercase; letter-spacing: .14em; font-weight: 600; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 22px; height: 30px; }
  .brand .caps { font-size: 19px; color: var(--gold); letter-spacing: .22em; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; box-shadow: 0 0 0 3px #0003; }
  .dot.on { background: var(--gold); box-shadow: 0 0 10px #E0B34A88; }
  .dot.other { background: var(--olive); }
  .dot.off { background: var(--red); }
  .open { display: none; }
  .open.show { display: inline-block; }

  .rope { height: 6px; background:
    repeating-linear-gradient(115deg, transparent 0 5px, #8C723255 5px 7px), transparent;
    border-top: 1px solid #8C723233; border-bottom: 1px solid #8C723233; border-radius: 3px; opacity: .8; }

  /* ---- typing ---- */
  .typer { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .field { display: flex; gap: 8px; align-items: stretch; }
  .field input {
    flex: 1; min-width: 0; font: 500 21px Barlow, sans-serif; color: var(--gold);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    outline: none; user-select: text; -webkit-user-select: text;
  }
  .field input::placeholder { color: #B5AF8C77; }
  .field input:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 3px #E0B34A22; }
  .mic {
    width: 56px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
    display: grid; place-items: center; color: var(--gold);
  }
  .mic svg { width: 24px; height: 24px; }
  .mic.rec { background: #3a1d12; border-color: var(--red); color: #ffcf9a; animation: glow 1.2s ease-in-out infinite; }
  .mic.busy { opacity: .6; }
  @keyframes glow { 50% { box-shadow: 0 0 18px #E0B34A66; } }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .hint { font-size: 13px; color: var(--muted); min-height: 18px; }
  .hint a { color: var(--gold); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .toggle input { accent-color: var(--gold); width: 18px; height: 18px; }

  button {
    font-family: "Barlow Condensed", Barlow, sans-serif; text-transform: uppercase; letter-spacing: .12em; font-weight: 600;
    font-size: 15px; color: var(--text); background: var(--bg2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 8px; touch-action: manipulation; cursor: pointer;
  }
  button:active, button.held { background: #2a2312; border-color: var(--gold-dim); color: var(--gold); }
  button.gold { background: var(--gold); color: #1a1406; border-color: var(--gold); }
  button.gold:active { background: #c99c38; color: #1a1406; }
  button.small { font-size: 12px; padding: 7px 10px; border-radius: 10px; }

  /* ---- d-pad ---- */
  .pad { position: relative; width: min(78vw, 300px); aspect-ratio: 1; margin: 6px auto 0; }
  .ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #1B2216, #10140D 70%); border: 1px solid var(--line); box-shadow: inset 0 0 0 10px #0B0E0955, 0 10px 30px #0008; }
  .pad button { position: absolute; border: none; background: transparent; border-radius: 0; color: var(--muted); padding: 0; display: grid; place-items: center; }
  .pad button svg { width: 30px; height: 30px; }
  .pad button:active, .pad button.held { color: var(--gold); background: radial-gradient(circle, #E0B34A26, transparent 70%); }
  .pad .up    { left: 30%; right: 30%; top: 0; height: 30%; }
  .pad .down  { left: 30%; right: 30%; bottom: 0; height: 30%; }
  .pad .left  { top: 30%; bottom: 30%; left: 0; width: 30%; }
  .pad .right { top: 30%; bottom: 30%; right: 0; width: 30%; }
  .pad .ok {
    left: 31%; top: 31%; width: 38%; height: 38%; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #2A3220, #161C12); border: 1px solid #3a4530;
    color: var(--gold); font-family: "Barlow Condensed", sans-serif; font-size: 22px; letter-spacing: .2em;
  }
  .pad .ok:active, .pad .ok.held { background: radial-gradient(circle, #4a3b16, #221b0b); box-shadow: 0 0 24px #E0B34A55; }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .icon { display: grid; place-items: center; padding: 11px 0; }
  .icon svg { width: 22px; height: 22px; }
  .label { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: .14em; }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s;
    background: #2a1a12; border: 1px solid var(--red); color: #ffd9c2; padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: 90vw; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .fly { position: fixed; width: 3px; height: 3px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px 2px #E0B34A88; opacity: 0; pointer-events: none; animation: fly 9s ease-in-out infinite; }
  @keyframes fly { 0%,100% { opacity: 0; transform: translate(0,0); } 30% { opacity: .9; } 50% { transform: translate(18px,-26px); } 70% { opacity: .5; } }
</style>
</head>
<body>
<span class="fly" style="left:8%;top:22%;animation-delay:0s"></span>
<span class="fly" style="right:7%;top:48%;animation-delay:3s"></span>
<span class="fly" style="left:12%;bottom:12%;animation-delay:6s"></span>

<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 22 30" aria-hidden="true"><path d="M11 1v4" stroke="#8C7232" stroke-width="1.4"/><path d="M6 8c0-3 10-3 10 0" fill="none" stroke="#E0B34A" stroke-width="1.4"/><rect x="4" y="8" width="14" height="17" rx="2.5" fill="#161C12" stroke="#E0B34A" stroke-width="1.4"/><path d="M11 12c2 2.5 3 4 3 6a3 3 0 0 1-6 0c0-2 1-3.5 3-6z" fill="#E0B34A"/><path d="M3 26h16v2H3z" fill="#7C8A4E"/></svg>
      <span class="caps">Hearth</span>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Looking for the TV…</span>
      <button class="small open" id="openBtn">Open</button></div>
  </header>

  <section class="typer">
    <div class="field">
      <input id="text" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" placeholder="Type, or talk…">
      <button class="mic" id="mic" aria-label="Talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></button>
    </div>
    <div class="row">
      <button class="gold" id="searchBtn">Search</button>
      <button id="askBtn">Ask for</button>
      <button id="clearBtn" style="flex:.7">Clear</button>
    </div>
    <div class="hint" id="hint">Letters show up live in whatever Hearth box has focus.</div>
    <label class="toggle"><input type="checkbox" id="otherApps"> Type into other apps too (slower, uses the Roku keyboard)</label>
  </section>

  <div class="rope"></div>

  <div class="grid3">
    <button data-key="Back" class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg><span class="label">Back</span></button>
    <button data-key="Home" class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span class="label">Roku home</span></button>
    <button data-key="Info" class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.6 5.4L19 7l-3.4 4.4L19 16l-5.4-1.4L12 20l-1.6-5.4L5 16l3.4-4.6L5 7l5.4 1.4z"/></svg><span class="label">Options</span></button>
  </div>

  <div class="pad">
    <div class="ring"></div>
    <button class="up" data-key="Up" data-repeat aria-label="Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 15 6-6 6 6"/></svg></button>
    <button class="down" data-key="Down" data-repeat aria-label="Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="left" data-key="Left" data-repeat aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>
    <button class="right" data-key="Right" data-repeat aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <button class="ok" data-key="Select">OK</button>
  </div>

  <div class="grid4">
    <button data-key="InstantReplay" class="icon" aria-label="Replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button>
    <button data-key="Rev" data-repeat class="icon" aria-label="Rewind"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12l-8-6zM21 6v12l-8-6z"/></svg></button>
    <button data-key="Play" class="icon" aria-label="Play or pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5v14l9-7zM15 5h2.5v14H15zM19.5 5H22v14h-2.5z"/></svg></button>
    <button data-key="Fwd" data-repeat class="icon" aria-label="Fast forward"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8-6zM3 6v12l8-6z"/></svg></button>
  </div>

  <div class="grid4">
    <button data-key="VolumeDown" data-repeat class="icon" aria-label="Volume down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4zM17 12h4"/></svg></button>
    <button data-key="VolumeMute" class="icon" aria-label="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6"/></svg></button>
    <button data-key="VolumeUp" data-repeat class="icon" aria-label="Volume up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4zM17 12h4M19 10v4"/></svg></button>
    <button data-key="Backspace" data-repeat class="icon" aria-label="Delete a letter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7zM12 9l5 6M17 9l-5 6"/></svg></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const input = $("text"), hint = $("hint"), mic = $("mic"), other = $("otherApps");
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
  }
  async function api(path, body, raw) {
    try {
      const r = await fetch(path, { method: "POST", headers: raw ? { "Content-Type": "application/octet-stream" } : { "Content-Type": "application/json" }, body: raw ? body : JSON.stringify(body || {}) });
      const j = await r.json();
      if (j.error) toast(j.error);
      return j;
    } catch (e) { toast("Can't reach the remote server."); return { error: String(e) }; }
  }

  // ---------- keys, with hold-to-repeat ----------
  document.querySelectorAll("[data-key]").forEach(b => {
    let delay, rep;
    const stop = () => { clearTimeout(delay); clearInterval(rep); b.classList.remove("held"); };
    b.addEventListener("pointerdown", e => {
      e.preventDefault(); buzz(); b.classList.add("held");
      // Delete trims the phone's text and re-sends it, so phone and TV stay the same
      const press = b.dataset.key === "Backspace"
        ? () => { input.value = input.value.slice(0, -1); push(); }
        : () => api("/api/key", { key: b.dataset.key });
      press();
      if (b.hasAttribute("data-repeat")) {
        delay = setTimeout(() => { rep = setInterval(press, 160); }, 420);
      }
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, stop));
  });

  // ---------- live text into Hearth ----------
  let sent = "", otherSent = "", busy = false, queued = null;
  async function pump() {
    if (busy || queued === null) return;
    busy = true;
    const job = queued; queued = null;
    if (job.go) {
      await api("/api/text", { text: job.text, go: job.go });
    } else if (other.checked) {
      let i = 0; const a = otherSent, b = job.text;
      while (i < a.length && i < b.length && a[i] === b[i]) i++;
      await api("/api/type", { back: a.length - i, add: b.slice(i) });
      otherSent = b;
    } else {
      await api("/api/text", { text: job.text });
    }
    sent = job.text;
    busy = false;
    pump();
  }
  function push(go) { queued = { text: input.value, go: go || "" }; pump(); }
  let typeTimer;
  input.addEventListener("input", () => { clearTimeout(typeTimer); typeTimer = setTimeout(() => push(), 140); });
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); push("search"); input.blur(); } });
  $("searchBtn").onclick = () => { buzz(); push("search"); };
  $("askBtn").onclick = () => { buzz(); push("request"); };
  $("clearBtn").onclick = () => { buzz(); input.value = ""; push(); };
  other.onchange = () => { otherSent = ""; hint.textContent = other.checked ? "Open a Roku keyboard on the TV first, with its box empty." : "Letters show up live in whatever Hearth box has focus."; };

  // ---------- TV status ----------
  async function status() {
    if (document.hidden) return;
    try {
      const s = await (await fetch("/api/status")).json();
      const dot = $("dot"), txt = $("statusText"), open = $("openBtn");
      dot.className = "dot " + (!s.tv ? "off" : s.hearth ? "on" : "other");
      txt.textContent = !s.tv ? "TV not answering" : s.hearth ? "Hearth is on" : (s.app || "TV on");
      open.classList.toggle("show", s.tv && !s.hearth);
      window.__https = s.httpsPort;
    } catch (e) { $("dot").className = "dot off"; $("statusText").textContent = "Server offline"; }
  }
  $("openBtn").onclick = async () => { buzz(); await api("/api/launch"); setTimeout(status, 1500); };
  status(); setInterval(status, 5000);
  document.addEventListener("visibilitychange", status);

  // ---------- voice (whisper on the NAS) ----------
  let rec = null;
  async function startRec() {
    if (!window.isSecureContext || !navigator.mediaDevices) {
      const port = window.__https || 8766;
      hint.innerHTML = 'The mic button needs the secure page: <a href="https://' + location.hostname + ':' + port + '/">open it here</a> (accept the warning once). Or tap the mic on your phone keyboard.';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const proc = ctx.createScriptProcessor(4096, 1, 1);
      const chunks = [];
      proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      src.connect(proc); proc.connect(ctx.destination);
      rec = { stream, ctx, proc, src, chunks, rate: ctx.sampleRate, started: Date.now() };
      mic.classList.add("rec"); hint.textContent = "Listening… tap the mic again when you're done.";
      rec.limit = setTimeout(stopRec, 15000);
    } catch (e) { hint.textContent = "The phone didn't allow the microphone."; }
  }
  function toPcm16k(chunks, rate) {
    let n = 0; chunks.forEach(c => n += c.length);
    const all = new Float32Array(n); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
    const ratio = rate / 16000, out = new Int16Array(Math.floor(n / ratio));
    for (let i = 0; i < out.length; i++) {
      const a = Math.floor(i * ratio), b = Math.min(n, Math.floor((i + 1) * ratio));
      let s = 0; for (let j = a; j < b; j++) s += all[j];
      const v = Math.max(-1, Math.min(1, s / Math.max(1, b - a)));
      out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    return out.buffer;
  }
  async function stopRec() {
    if (!rec) return;
    const r = rec; rec = null; clearTimeout(r.limit);
    r.proc.disconnect(); r.src.disconnect(); r.stream.getTracks().forEach(t => t.stop()); r.ctx.close();
    mic.classList.remove("rec"); mic.classList.add("busy"); hint.textContent = "Working it out…";
    const j = await api("/api/voice", toPcm16k(r.chunks, r.rate), true);
    mic.classList.remove("busy");
    if (j.text) {
      input.value = j.text.replace(/[.!?]+$/, "");
      hint.textContent = "Heard: " + j.text;
      push();
    } else if (!j.error) hint.textContent = "Didn't catch that. Try again?";
  }
  mic.addEventListener("click", () => { buzz(); rec ? stopRec() : startRec(); });
})();
</script>
</body>
</html>
