# Hearth phone remote. Lives at /volume1/docker/hearth-remote/compose.yaml
services:
  hearth-remote:
    build: .
    image: hearth-remote:local
    container_name: hearth-remote
    network_mode: host          # reaches the TV (ECP :8060) and whisper (:10300) directly
    environment:
      TV_IP: 192.168.254.9
      PROJECTOR_IP: 192.168.254.62   # the Yincodi projector's browser is let in without the house key
      HTTP_PORT: "8765"
      HTTPS_PORT: "8766"
      WHISPER_HOST: 127.0.0.1   # whisper runs on this NAS
      WHISPER_PORT: "10300"
      WHISPER_LANG: en
      CERT_SAN: IP:192.168.254.41,DNS:localhost
      PUBLIC_URL: http://192.168.254.41:8765
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}      # from the .env file next to this one (see README)
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
      MUSIC_ROOT: /volume1
    volumes:
      - ./data:/data            # HTTPS certificate, lyrics cache, Last.fm session
      - /volume1/music:/volume1/music:ro            # .lrc lyrics files next to songs
      - /volume1/plex/plex/music:/volume1/plex/plex/music:ro
      - /volume1/plex/plex:/volume1/plex/plex:ro    # your Ambiance clips (the hearth folder), read only
    restart: unless-stopped
